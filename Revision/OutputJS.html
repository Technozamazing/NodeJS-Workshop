<!-- What happens when we call document.write() after the page loads... -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>This is some texts....</p>

    <script>
        setTimeout( ()=>{document.write("Sorry previous Texts were overwritten...")}, 2000 );
    </script>
</body>
</html>
