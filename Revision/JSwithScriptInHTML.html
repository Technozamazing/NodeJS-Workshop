<!-- By using external JavaScript -->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 id="title">Demo external JavaScript</h2>
    <p id="text">Text to be changed...</p>

    <button type="button" onclick="changeText('text')">Change Text</button>
    <button type="button" onclick="changeTitle('title')">Change Title</button>

    <p>This example links to <strong>changeText.js</strong> and <strong>changeTitle.js</strong><br>Here, <strong>changeText function</strong> and <strong>changeTitle function</strong> is stored in <strong>changeText.js</strong> and <strong>changeTitle.js</strong> respectively.</p>
    <script src="changeText.js"></script>
    <script src="changeTitle.js"></script>
</body>
</html>
